<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>QuantSphere</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070d; color: #eef1fb;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .boot { text-align: center; }
  .bolt { font-size: 48px; }
  .word { font-size: 20px; font-weight: 700; margin-top: 8px; }

</style>

<body>
  <div class="boot">
    <div class="bolt">⚡</div>
    <div class="word">QuantSphere</div>
    <div class="status">Loading…</div>
  </div>
  <!--
    This page is only ever seen for an instant, if at all — Capacitor's
    server.url config (see ../capacitor.config.json) makes the app navigate
    straight to the live, hosted QuantSphere web app on launch. Nothing here
    needs to match that app's real UI.
  -->
</body>
</html>
