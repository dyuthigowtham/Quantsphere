[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[project]
name = "quantsphere"
version = "0.2.0"
description = "QuantSphere - paper trading journal with MT5 sync, screenshot capture, and local hybrid XAI trade grading."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "aiofiles>=24.1",
    "python-multipart>=0.0.12",
    "MetaTrader5>=5.0.45 ; platform_system == 'Windows'",
    "cryptography>=42.0",
    "feedparser>=6.0",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
